[package]
name = "lovebox"
version = "0.1.0"
edition = "2021"
description = "love-box: the e-paper picture frame service that runs on the Raspberry Pi Zero W"
publish = false
build = "build.rs"

# U-101 rule: no C dependencies yet (no openssl, ring, sqlite). Check with
# `cargo tree --target arm-unknown-linux-gnueabihf -e build | grep -w cc` (expect nothing).
[dependencies]
# Renderer (U-201). All pure Rust. `image` without default features: no rayon (the Pi has one
# core) and only the formats the photo pipeline accepts. `png` is the same version `image`
# uses; it is used directly to write 1-bit PNGs.
ab_glyph = "0.2.32"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp"] }
png = "0.18.1"
# Reduced IDCT decoding, no rayon: one worker on the Pi Zero W.
jpeg-decoder = { version = "0.3.2", default-features = false }
tokio = { version = "1.54.0", default-features = false, features = ["rt", "macros", "signal", "time", "sync", "net", "io-util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
kamadak-exif = "0.6"
fs2 = "0.4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace"] }
ulid = "1"
ureq = { version = "2.12", default-features = false }

[features]
default = []
hardware = ["dep:epd-waveshare", "dep:rppal"]

[target.'cfg(all(target_os = "linux", target_arch = "arm"))'.dependencies]
# Upstream exposes epd7in5_v2 unconditionally but its unrelated 2.13 module requires one LUT cfg.
epd-waveshare = { git = "https://github.com/rust-embedded-community/epd-waveshare", rev = "48458e195662eab97d10e852893295ee0876ba74", optional = true, default-features = false, features = ["epd2in13_v3"] }
rppal = { version = "0.22.1", optional = true, features = ["embedded-hal"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Optimise dependencies (image decoders, font rasteriser) in dev and test builds, so the
# 24 MP decode tests run in seconds; our own crate stays at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# The Pi Zero W has 512 MB RAM and a slow SD card: keep the binary small.
lto = true
codegen-units = 1
strip = true
